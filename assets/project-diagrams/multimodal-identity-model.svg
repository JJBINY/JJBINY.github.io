<rect x="40" y="292" width="416" height="140" rx="14" fill="#edf4f7" stroke="#ccd9e0"/><text class="label mono" x="64" y="320">WHY THE IDS SURVIVE</text><text class="title" x="64" y="348">검색 표현은 canonical identity를 대체하지 않습니다.</text><text class="meta" x="64" y="376">Passage는 recall projection, Fragment는 원문 locator입니다.</text><text class="micro mono" x="64" y="404">Document → Chunk → Element → page · bbox</text>
