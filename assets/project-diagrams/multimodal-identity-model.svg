<svg viewBox="0 0 960 600" data-visual-kind="identity-relationship-model" data-diagram-grammar="relationship" data-motion-profile="identity-lineage" data-critical-font-size="12" role="img" aria-labelledby="multimodal-identity-model-title multimodal-identity-model-desc" xmlns="http://www.w3.org/2000/svg"><title id="multimodal-identity-model-title">Document–Chunk–Element 식별 계약과 파생 참조</title><desc id="multimodal-identity-model-desc">Media, Chunk, Element의 소유 관계와 DerivedDescription, IndexDocument가 canonical identity를 참조하는 카디널리티 모델.</desc>
<defs>
  <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#536174"/></marker>
  <marker id="arrow-signal" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#147765"/></marker>
  <marker id="arrow-open" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#28658a" stroke-width="1.2"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0b1525}
    .mono{font-family:'SFMono-Regular','Roboto Mono',Consolas,monospace;letter-spacing:.08em}
    .label{font-size:8px;font-weight:700;fill:#80909e}
    .title{font-size:16px;font-weight:700}
    .meta{font-size:12px;fill:#536174}
    .micro{font-size:8px;fill:#80909e}
    .on-dark{fill:#ffffff}.on-dark-soft{fill:#d4e4ea}
    .node{fill:#ffffff;stroke:#ccd9e0;stroke-width:1.2}
    .node-soft{fill:#edf3f6;stroke:#ccd9e0;stroke-width:1}
    .node-signal{fill:#e1f2ed;stroke:#147765;stroke-width:1.5}
    .flow{fill:none;stroke:#536174;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .flow-signal{fill:none;stroke:#147765;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-signal)}
    .flow-dashed{fill:none;stroke:#28658a;stroke-width:1.3;stroke-dasharray:6 6;stroke-linecap:round;marker-end:url(#arrow-open)}
    .relationship{fill:none;stroke:#536174;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .edge-motion{fill:none;stroke:#536174;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;marker-end:none}
    .edge-motion--signal{stroke:#147765;stroke-width:1.5}.edge-motion--dashed{stroke:#28658a}
    .edge-label-mask{fill:#f5f9fb}
    .flow-live{stroke-dasharray:10 8;animation:diagram-identity-lineage-flow 12s linear infinite}
    .pulse{animation:diagram-identity-lineage-focus 12s ease-in-out infinite}
    .phase{animation:diagram-identity-lineage-phase-a 12s ease-in-out infinite}
    .phase-b{animation-name:diagram-identity-lineage-phase-b}.phase-c{animation-name:diagram-identity-lineage-phase-c}.phase-d{animation-name:diagram-identity-lineage-phase-d}
    @keyframes diagram-identity-lineage-flow{0%{stroke-dashoffset:72;opacity:.58}8%,78%{opacity:1}90%,100%{stroke-dashoffset:-72;opacity:.82}}
    @keyframes diagram-identity-lineage-focus{0%,8%{opacity:.74}18%,78%{opacity:1}90%,100%{opacity:.84}}
    @keyframes diagram-identity-lineage-phase-a{0%,4%{opacity:.62}8%,26%{opacity:1}90%,100%{opacity:.82}}
    @keyframes diagram-identity-lineage-phase-b{0%,28%{opacity:.62}32%,50%{opacity:1}90%,100%{opacity:.82}}
    @keyframes diagram-identity-lineage-phase-c{0%,52%{opacity:.62}56%,74%{opacity:1}90%,100%{opacity:.82}}
    @keyframes diagram-identity-lineage-phase-d{0%,72%{opacity:.62}76%,90%{opacity:1}90%,100%{opacity:.82}}
    @media(prefers-reduced-motion:reduce){.flow-live,.pulse,.phase{animation:none!important}}
  </style>
</defs><rect width="960" height="600" fill="#f5f9fb"/>
